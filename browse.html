<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyMatch - browse requests</title>
  <script src="js/theme.js"></script>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <img class="logo" src="assets/logo.svg" alt="" width="32" height="32">
    <h1>StudyMatch</h1>
  </header>

  <main>
    <section class="card" aria-labelledby="filter-title">
      <h2 id="filter-title">Browse requests</h2>

      <label for="matchRequest">Match one of my requests</label>
      <select id="matchRequest"></select>

      <fieldset class="subject-filter" data-nodirty>
        <legend>Show subjects for</legend>
        <div class="row">
          <div>
            <label for="sfMajor">Major</label>
            <select id="sfMajor" data-searchable></select>
          </div>
          <div>
            <label for="sfYear">Year</label>
            <select id="sfYear">
              <option value="">Any year</option>
              <option>1</option><option>2</option><option>3</option>
              <option>4</option><option>5</option><option>6</option>
            </select>
          </div>
          <div>
            <label for="sfTerm">Trimester</label>
            <select id="sfTerm">
              <option value="">Any trimester</option>
              <option>1</option><option>2</option><option>3</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button id="sfMine" type="button" class="secondary">My major and year</button>
          <button id="sfAll" type="button" class="secondary">Show all subjects</button>
        </div>
        <p id="sfHint" class="hint" aria-live="polite"></p>
      </fieldset>

      <label for="fSubject">Subject (course)</label>
      <select id="fSubject" data-searchable></select>

      <div class="row">
        <div>
          <label for="fLocation">Place</label>
          <select id="fLocation" data-searchable></select>
        </div>
        <div>
          <label for="fFormat">Format</label>
          <select id="fFormat">
            <option value="">Any format</option>
            <option value="in_person">In person</option>
            <option value="online">Online</option>
          </select>
        </div>
        <div>
          <label for="fDate">Day</label>
          <input id="fDate" type="date">
        </div>
      </div>

      <label class="check-line"><input id="fMine" type="checkbox"> Only subjects from my profile</label>

      <div class="actions">
        <button id="searchBtn" type="button">Search</button>
        <button id="resetSkipsBtn" type="button" class="secondary">Show skipped requests again</button>
      </div>
      <p id="pageStatus" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="card" aria-labelledby="list-title">
      <h2 id="list-title">Available requests</h2>
      <ul id="list" class="people"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/subject-filter.js"></script>
  <script src="js/requests-common.js"></script>
  <script src="js/browse.js"></script>
</body>
</html>
