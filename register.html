<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyMatch - create an account</title>
  <script src="js/theme.js"></script>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <img class="logo" src="assets/logo.svg" alt="" width="32" height="32">
    <h1>StudyMatch</h1>
  </header>

  <main>
    <section class="card" aria-labelledby="signup-title">
      <h2 id="signup-title">Create an account</h2>
      <p class="hint">Only university e-mail addresses can register. You will get a confirmation link by e-mail.</p>
      <form id="signupForm">
        <label for="suName">Full name</label>
        <input id="suName" type="text" autocomplete="name" maxlength="80" required>

        <label for="suEmail">University e-mail</label>
        <input id="suEmail" type="email" autocomplete="email" required>

        <label for="suPassword">Password</label>
        <input id="suPassword" type="password" autocomplete="new-password" required>
        <ul id="rules" class="rules" aria-label="Password rules"></ul>
        <div class="meter" aria-hidden="true"><div id="meterBar"></div></div>
        <p id="meterLabel" class="hint"></p>

        <label for="suPassword2">Repeat the password</label>
        <input id="suPassword2" type="password" autocomplete="new-password" required>
        <label class="check-line"><input id="showPw" type="checkbox"> Show passwords</label>

        <div class="row">
          <div>
            <label for="suMajor">Major</label>
            <select id="suMajor" data-searchable required></select>
          </div>
          <div>
            <label for="suYear">Year of study</label>
            <select id="suYear" required>
              <option value="">Choose...</option>
              <option>1</option><option>2</option><option>3</option>
              <option>4</option><option>5</option><option>6</option>
            </select>
          </div>
        </div>

        <button type="submit">Create account</button>
      </form>
      <p id="suStatus" class="status" role="status" aria-live="polite"></p>

      <div class="auth-switch">
        <p>Already have an account?</p>
        <a class="button-link secondary" href="login.html">Sign in</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/password.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
