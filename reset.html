<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyMatch - new password</title>
  <script src="js/theme.js"></script>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <img class="logo" src="assets/logo.svg" alt="" width="32" height="32">
    <h1>StudyMatch</h1>
  </header>

  <main>
    <section class="card" aria-labelledby="reset-title">
      <h2 id="reset-title">Choose a new password</h2>
      <p id="resetNote" class="status" role="status" aria-live="polite"></p>
      <form id="resetForm" hidden>
        <label for="rsPassword">New password</label>
        <input id="rsPassword" type="password" autocomplete="new-password" required>
        <ul id="rules" class="rules" aria-label="Password rules"></ul>
        <div class="meter" aria-hidden="true"><div id="meterBar"></div></div>
        <p id="meterLabel" class="hint"></p>

        <label for="rsPassword2">Repeat the new password</label>
        <input id="rsPassword2" type="password" autocomplete="new-password" required>
        <label class="check-line"><input id="showPw" type="checkbox"> Show passwords</label>
        <button type="submit">Save the new password</button>
      </form>
      <p id="rsStatus" class="status" role="status" aria-live="polite"></p>
      <div class="auth-switch">
        <a class="button-link secondary" href="login.html">Back to sign in</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/password.js"></script>
  <script src="js/reset.js"></script>
</body>
</html>
