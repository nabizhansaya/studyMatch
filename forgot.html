<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyMatch - forgot password</title>
  <script src="js/theme.js"></script>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <img class="logo" src="assets/logo.svg" alt="" width="32" height="32">
    <h1>StudyMatch</h1>
  </header>

  <main>
    <section class="card" aria-labelledby="forgot-title">
      <h2 id="forgot-title">Forgot your password?</h2>

      <div id="stepEmail">
        <p class="hint">Enter your e-mail address. If an account exists, we send you a code.</p>
        <form id="forgotForm">
          <label for="fgEmail">University e-mail</label>
          <input id="fgEmail" type="email" autocomplete="email" required>
          <button type="submit">Send the code</button>
        </form>
      </div>

      <div id="stepCode" hidden>
        <p id="codeNote" class="hint"></p>
        <form id="codeForm">
          <label for="fgCode">Code from the e-mail</label>
          <input id="fgCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required>

          <label for="fgPassword">New password</label>
          <input id="fgPassword" type="password" autocomplete="new-password" required>
          <ul id="rules" class="rules" aria-label="Password rules"></ul>
          <div class="meter" aria-hidden="true"><div id="meterBar"></div></div>
          <p id="meterLabel" class="hint"></p>

          <label for="fgPassword2">Repeat the new password</label>
          <input id="fgPassword2" type="password" autocomplete="new-password" required>
          <label class="check-line"><input id="showPw" type="checkbox"> Show passwords</label>

          <div class="actions">
            <button type="submit">Save the new password</button>
            <button id="resendBtn" type="button" class="secondary">Send a new code</button>
          </div>
        </form>
      </div>

      <p id="fgStatus" class="status" role="status" aria-live="polite"></p>
      <div class="auth-switch">
        <a class="button-link secondary" href="login.html">Back to sign in</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/password.js"></script>
  <script src="js/forgot.js"></script>
</body>
</html>
