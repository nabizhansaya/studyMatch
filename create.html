<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyMatch - create a request</title>
  <script src="js/theme.js"></script>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <img class="logo" src="assets/logo.svg" alt="" width="32" height="32">
    <h1>StudyMatch</h1>
  </header>

  <main>
    <section class="card" aria-labelledby="create-title">
      <h2 id="create-title">Create a study request</h2>
      <p class="hint">Your request appears on other students' Swipe and Browse pages. When someone accepts it, you both get each other's Telegram username.</p>

      <form id="createForm">
        <fieldset class="subject-filter" data-nodirty>
          <legend>Show subjects for</legend>
          <div class="row">
            <div>
              <label for="sfMajor">Major</label>
              <select id="sfMajor" data-searchable></select>
            </div>
            <div>
              <label for="sfYear">Year</label>
              <select id="sfYear">
                <option value="">Any year</option>
                <option>1</option><option>2</option><option>3</option>
              </select>
            </div>
            <div>
              <label for="sfTerm">Trimester</label>
              <select id="sfTerm">
                <option value="">Any trimester</option>
                <option>1</option><option>2</option><option>3</option>
              </select>
            </div>
          </div>
          <div class="actions">
            <button id="sfMine" type="button" class="secondary">My major and year</button>
            <button id="sfAll" type="button" class="secondary">Show all subjects</button>
          </div>
          <p id="sfHint" class="hint" aria-live="polite"></p>
        </fieldset>

        <label for="cSubject">Subject (course)</label>
        <select id="cSubject" data-searchable required></select>

        <label for="cStart">Date and time</label>
        <input id="cStart" type="datetime-local" required>

        <div class="row">
          <div>
            <label for="cFormat">Format</label>
            <select id="cFormat">
              <option value="in_person">In person</option>
              <option value="online">Online</option>
            </select>
          </div>
          <div>
            <label for="cDuration">Length</label>
            <select id="cDuration">
              <option value="30">30 minutes</option>
              <option value="60" selected>1 hour</option>
              <option value="90">1.5 hours</option>
              <option value="120">2 hours</option>
              <option value="180">3 hours</option>
            </select>
          </div>
        </div>

        <div id="placeBox">
          <label for="cLocation">Place</label>
          <select id="cLocation" data-searchable required></select>
        </div>
        <div id="detailsBox" hidden>
          <label for="cDetails">Specify the place</label>
          <input id="cDetails" type="text" maxlength="100" placeholder="For example: room 214, building B">
        </div>

        <label for="cMessage">Message (optional)</label>
        <textarea id="cMessage" maxlength="200" placeholder="For example: Exam preparation, chapter 3-5"></textarea>

        <button type="submit">Post request</button>
      </form>
      <p id="cStatus" class="status" role="status" aria-live="polite"></p>
      <p><a href="matches.html">See my requests and sessions</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/subject-filter.js"></script>
  <script src="js/create.js"></script>
</body>
</html>
