<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyMatch - sign in</title>
  <script src="js/theme.js"></script>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <img class="logo" src="assets/logo.svg" alt="" width="32" height="32">
    <h1>StudyMatch</h1>
  </header>

  <main>
    <div class="hero">
      <img class="hero-img" src="assets/hero-960.webp"
           srcset="assets/hero-480.webp 480w, assets/hero-960.webp 960w"
           sizes="(max-width: 760px) 100vw, 720px" width="960" height="640"
           alt="Two students sit side by side with a stack of books, and a study request card with a green check mark floats between them.">
      <div class="hero-text">
        <h2>Find a study partner in seconds</h2>
        <p>Post a request or accept someone else's.</p>
      </div>
    </div>

    <section class="card" aria-labelledby="signin-title">
      <h2 id="signin-title">Sign in</h2>
      <form id="signinForm">
        <label for="siEmail">University e-mail</label>
        <input id="siEmail" type="email" autocomplete="email" required>

        <label for="siPassword">Password</label>
        <input id="siPassword" type="password" autocomplete="current-password" required>

        <label class="check-line"><input id="siKeep" type="checkbox"> Keep me signed in on this device</label>
        <p class="hint">If you leave this unticked, you are signed out when you close the tab, and after 1 hour without activity.</p>

        <button type="submit">Sign in</button>
      </form>
      <p id="siStatus" class="status" role="status" aria-live="polite"></p>
      <p><a href="forgot.html">Forgot your password?</a></p>

      <div class="auth-switch">
        <p>Not registered yet?</p>
        <a class="button-link secondary" href="register.html">Create an account</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
